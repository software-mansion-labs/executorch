gemma_sdpa_compute_attn_weights_coop:
  parameter_names_with_default_values:
    DTYPE: float
    IO_STORAGE: texture3d
    K_CACHE_STORAGE: texture3d
    HAS_MASK: 0
    MASK_PER_HEAD: 0
    HAS_SOFTCAP: 0
    TILE_K4: 1
    TILE_N4: 1
  generate_variant_forall:
    combination:
      parameter_names: [IO_STORAGE, K_CACHE_STORAGE]
      combos:
        - parameter_values: [texture3d, texture3d]
        - parameter_values: [buffer, texture3d]
        - parameter_values: [buffer, buffer]
    DTYPE:
      - VALUE: float
      - VALUE: half
  shader_variants:
    - NAME: gemma_sdpa_compute_attn_weights_coop_nomask
      HAS_MASK: 0
      MASK_PER_HEAD: 0
      HAS_SOFTCAP: 0
    - NAME: gemma_sdpa_compute_attn_weights_coop_mask
      HAS_MASK: 1
      MASK_PER_HEAD: 0
      HAS_SOFTCAP: 0
    - NAME: gemma_sdpa_compute_attn_weights_coop_mask_softcap
      HAS_MASK: 1
      MASK_PER_HEAD: 0
      HAS_SOFTCAP: 1
    - NAME: gemma_sdpa_compute_attn_weights_coop_mask_phmask
      HAS_MASK: 1
      MASK_PER_HEAD: 1
      HAS_SOFTCAP: 0
    - NAME: gemma_sdpa_compute_attn_weights_coop_mask_phmask_softcap
      HAS_MASK: 1
      MASK_PER_HEAD: 1
      HAS_SOFTCAP: 1
